name: rs16_lap_timer
description: RS16 GPS Lap Timer - Racing HUD Dashboard
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # BLE connectivity to RS16 hardware
  flutter_blue_plus: ^1.31.12

  # Local session storage
  sqflite: ^2.3.3
  path: ^1.9.0

  # Track map view
  flutter_map: ^6.1.0
  latlong2: ^0.9.1

  # UI helpers
  fl_chart: ^0.68.0
  provider: ^6.1.2
  intl: ^0.19.0
  share_plus: ^9.0.0
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
